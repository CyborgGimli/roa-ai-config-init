name: Bump plugin version

# The marketplace lives in roa-ai-config/, not at the repository root.
# Every `run:` step below resolves through defaults.run.working-directory;
# git-auto-commit is not a `run:` step and takes repository-root-relative
# paths, so its file_pattern carries the prefix explicitly.

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Semver increment to apply to every plugin"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: roa-ai-config

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bump plugin versions
        run: node scripts/bump-version.mjs "${{ inputs.increment }}"

      - name: Build generated plugins
        run: node scripts/build.mjs

      - name: Validate generated plugins
        run: node scripts/validate.mjs

      - name: Read bumped version
        id: version
        run: |
          NEW_VERSION="$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('source/plugins/roa-base/plugin-config.json','utf8')); process.stdout.write(c.version);")"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: bump plugins to v${{ steps.version.outputs.version }}"
          file_pattern: "roa-ai-config/source roa-ai-config/dist roa-ai-config/.claude-plugin roa-ai-config/README.md roa-ai-config/build-config.json roa-ai-config/package.json"
