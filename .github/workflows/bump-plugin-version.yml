name: Bump plugin version

# The plugin sources live in roa-ai-config/, but .claude-plugin/marketplace.json
# is written to the repository root, because that is where Claude Code looks for
# a marketplace when it clones this repo.
# Every `run:` step below resolves through defaults.run.working-directory;
# git-auto-commit is not a `run:` step and takes repository-root-relative
# paths, so its file_pattern carries the prefix explicitly.

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Semver increment to apply to every plugin"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: roa-ai-config

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Bump plugin versions
        run: node scripts/bump-version.mjs "${{ inputs.increment }}"

      - name: Build generated plugins
        run: node scripts/build.mjs

      - name: Validate generated plugins
        run: node scripts/validate.mjs

      - name: Read bumped version
        id: version
        run: |
          NEW_VERSION="$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('build-config.json','utf8')); process.stdout.write(c.marketplace.version);")"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        id: commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: bump plugins to v${{ steps.version.outputs.version }}"
          file_pattern: "roa-ai-config/source roa-ai-config/dist .claude-plugin roa-ai-config/README.md roa-ai-config/build-config.json roa-ai-config/package.json"

      - name: Tag marketplace release
        if: steps.commit.outputs.changes_detected == 'true'
        working-directory: .
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.commit_hash }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} already exists, skipping"
          else
            git tag -a "${tag}" "${SHA}" -m "roa-ai marketplace ${tag}"
            echo "tagged ${tag} -> ${SHA}"
            git push origin "refs/tags/${tag}"
          fi
