name: Bump plugin version

# The plugin sources live in roa-ai-config/, but .claude-plugin/marketplace.json
# is written to the repository root, because that is where Claude Code looks for
# a marketplace when it clones this repo.
# Every `run:` step below resolves through defaults.run.working-directory;
# git-auto-commit is not a `run:` step and takes repository-root-relative
# paths, so its file_pattern carries the prefix explicitly.

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Semver increment to apply to every plugin"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: roa-ai-config

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bump plugin versions
        run: node scripts/bump-version.mjs "${{ inputs.increment }}"

      - name: Build generated plugins
        run: node scripts/build.mjs

      - name: Validate generated plugins
        run: node scripts/validate.mjs

      - name: Read bumped version
        id: version
        run: |
          NEW_VERSION="$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('source/plugins/roa-base/plugin-config.json','utf8')); process.stdout.write(c.version);")"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: bump plugins to v${{ steps.version.outputs.version }}"
          file_pattern: "roa-ai-config/source roa-ai-config/dist .claude-plugin roa-ai-config/README.md roa-ai-config/build-config.json roa-ai-config/package.json"

      # setup.mjs pins each target repo to marketplace ref "<plugin>--v<version>",
      # so every bump has to publish those tags or the pinned ref dangles and a
      # consumer resolving the marketplace from GitHub cannot install anything.
      - name: Tag plugin releases
        if: steps.commit.outputs.changes_detected == 'true'
        working-directory: .
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.commit_hash }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for plugin in $(ls roa-ai-config/source/plugins); do
            tag="${plugin}--v${VERSION}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "tag ${tag} already exists, skipping"
              continue
            fi
            git tag -a "${tag}" "${SHA}" -m "${plugin} v${VERSION}"
            echo "tagged ${tag} -> ${SHA}"
          done
          git push origin --tags
