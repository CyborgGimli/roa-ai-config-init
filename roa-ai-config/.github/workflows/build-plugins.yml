name: Build Claude Code plugins

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect generated artifact edits in PR
        if: github.event_name == 'pull_request'
        id: pr-generated
        uses: dorny/paths-filter@v3
        with:
          filters: |
            generated:
              - '.claude-plugin/marketplace.json'
              - 'dist/**'

      - name: Keep PRs source-only for generated artifacts
        if: github.event_name == 'pull_request' && steps.pr-generated.outputs.generated == 'true'
        run: |
          echo "Generated artifacts should not be edited in pull requests."
          echo "Edit source files and plugin-config.json files instead; main will regenerate dist."
          exit 1

      - name: Build and validate generated plugins
        run: node scripts/validate.mjs

      - name: Report generated diff on PR
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- .claude-plugin/marketplace.json dist; then
            echo "Generated artifacts are unchanged."
          else
            echo "Generated artifacts would change after this PR."
            echo "They will be committed automatically after merge to main."
            git diff --stat -- .claude-plugin/marketplace.json dist
          fi

      - name: Commit generated files on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: rebuild Claude Code plugins"
          file_pattern: ".claude-plugin/marketplace.json dist"
