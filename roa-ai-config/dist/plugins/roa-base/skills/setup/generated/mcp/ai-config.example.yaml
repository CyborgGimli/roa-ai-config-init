# ROA AI project configuration.
# Commit this file after replacing examples with non-secret repository facts.
# Keep secrets in environment variables, OAuth login, managed settings, or local secret stores.
# Values that still contain "example.com" are treated as unset: setup skips the server that needs them.

version: 1

security:
  # Origins (scheme://host[:port]) the browser/DevTools MCP tools may navigate to and
  # WebFetch may read without asking. Put the application under test here, e.g.
  #   allowedOrigins: [http://localhost:8080, https://app.test.internal]
  # Empty means every navigation asks for confirmation.
  allowedOrigins: []

mcp:
  defaults:
    enabled: true
    timeout: 600000
    alwaysLoad: false

  servers:
    # Off by default: its tools can publish repository content to GitHub.
    github:
      enabled: false
      tokenEnv: GITHUB_PERSONAL_ACCESS_TOKEN

    swagger:
      enabled: true
      apiBaseUrl: https://api.example.com
      apiDocsUrl: https://api.example.com/openapi.json

    selenium:
      enabled: true

    browser:
      enabled: true

    chrome-devtools:
      enabled: true
