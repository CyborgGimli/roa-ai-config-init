# ROA AI project configuration.
# Commit this file after replacing examples with non-secret repo facts.
# Keep secrets in environment variables, OAuth login, managed settings, or a local
# secret store - never here.

version: 1

# Application log file the debug monitor tails.
# /roa-base:setup writes this path to ROA_LOG_FILE in .claude/settings.json.
logs:
  file: logs/roa.log

mcp:
  defaults:
    enabled: true
    timeout: 600000
    alwaysLoad: false

  servers:
    # Browser automation for UI test development.
    playwright:
      enabled: false

    # One generated MCP server per database entry.
    postgresql:
      enabled: false
      databases: []
      # databases:
      #   - name: payments
      #     dsnEnv: PAYMENTS_POSTGRES_DSN

    github:
      enabled: false
      repositories: []
      # repositories:
      #   - your-org/your-repo
      tokenEnv: GITHUB_TOKEN
      # overrides are rendered and deep-merged last, so a repository can adapt the
      # shared catalog without changing the plugin:
      # overrides:
      #   env:
      #     ROA_MCP_GITHUB_REPOSITORIES: your-org/your-repo
